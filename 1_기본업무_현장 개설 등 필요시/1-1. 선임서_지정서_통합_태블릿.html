<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>선임서 · 지정서 (통합)</title>
<style>
  :root{ --line:#333; --hd:#1f4e79; --hdbg:#dbe5f1; --accent:#1f6feb; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; font-family:"맑은 고딕","Malgun Gothic",AppleGothic,sans-serif; color:#111; background:#f2f4f7; }
  .wrap{ max-width:820px; margin:0 auto; padding:12px; }
  .selbar{ background:#fff; border:1.5px solid var(--accent); border-radius:10px; padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; color:var(--hd); }
  .selbar select{ flex:1; font-size:15px; font-weight:700; padding:7px 8px; font-family:inherit; border:1.5px solid var(--accent); border-radius:6px; color:var(--hd); }
  .paper{ background:#fff; padding:40px 46px 48px; box-shadow:0 1px 6px rgba(0,0,0,.15); }
  h1{ text-align:center; font-size:29px; margin:6px 0 40px; letter-spacing:8px; font-weight:800; }
  .meta{ margin:0 auto 34px; max-width:480px; font-size:18px; }
  .mrow{ display:flex; align-items:center; margin:12px 0; }
  .mlabel{ width:82px; flex:0 0 auto; font-weight:700; text-align:justify; text-align-last:justify; }
  .mcolon{ width:16px; flex:0 0 auto; }
  .mval{ flex:1; min-width:0; border:none; border-bottom:1.5px solid #555; font-size:18px; font-family:inherit; padding:4px 6px; background:transparent; text-align:center; }
  .mval:focus{ outline:none; border-bottom-color:var(--accent); }
  .mfixed{ border-bottom:none; font-weight:700; }
  .body{ font-size:18px; line-height:2; text-align:center; margin:30px 0 26px; }
  .duties{ border:1.5px solid var(--line); padding:16px 20px; margin:0 0 38px; font-size:14.5px; line-height:1.85; }
  .duties .dt{ font-weight:700; margin:2px 0 6px; }
  .duties ol{ margin:0 0 6px; padding-left:22px; }
  .duties ol:last-child{ margin-bottom:0; }
  .duties li{ margin:3px 0; }
  .datewrap{ text-align:center; margin:40px 0 26px; }
  .datewrap input[type=date]{ font-size:15px; font-family:inherit; padding:4px 6px; border:1px solid #bbb; border-radius:5px; }
  .dtext{ font-size:20px; letter-spacing:3px; margin-top:8px; font-weight:600; }
  .sign{ text-align:center; font-size:21px; font-weight:700; letter-spacing:2px; margin-top:24px; }
  .sign .co{ letter-spacing:1px; }
  .controls{ position:sticky; bottom:0; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px; background:rgba(242,244,247,.95); margin-top:14px; }
  .btn{ border:none; border-radius:8px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.p{ background:var(--accent); color:#fff; } .btn.g{ background:#5b6470; color:#fff; } .btn.d{ background:#fff; color:#333; border:1.5px solid #bbb; }
  @media print{
    body{ background:#fff; } .wrap{ padding:0; max-width:none; } .paper{ box-shadow:none; padding:18mm 22mm; }
    .selbar,.controls{ display:none !important; }
    .datewrap input[type=date]{ display:none !important; }
    @page{ size:A4 portrait; margin:0; }
  }
</style>
</head>
<body>
<div class="wrap">
 <div class="selbar">선임 직명 <select id="type" onchange="render()"></select></div>

 <div class="paper">
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div class="body" id="law"></div>
  <div class="duties" id="duties"></div>
  <div class="datewrap">
    <input type="date" id="day" onchange="fmtDate()">
    <div class="dtext" id="dtext"></div>
  </div>
  <div class="sign" id="sign"></div>
 </div>
</div>

<div class="controls">
  <button class="btn p" onclick="printDoc()">📄 PDF로 저장 / 인쇄</button>
  <button class="btn d" onclick="saveDraft()">💾 임시저장</button>
  <button class="btn g" onclick="clearAll()">전체 초기화</button>
</div>

<script>
const CO='(주)디아키즈 건설';
const DUTY_MGR=[
 "산업재해 예방계획의 수립에 관한 사항",
 "법 제25조 및 제26조에 따른 안전보건관리규정의 작성 및 변경에 관한 사항",
 "법 제29조에 따른 안전·보건교육에 관한 사항",
 "작업환경측정 등 작업환경의 점검 및 개선에 관한 사항",
 "법 제129조부터 제132조까지에 따른 근로자의 건강진단 등 건강관리에 관한 사항",
 "산업재해의 원인 조사 및 재발 방지대책 수립에 관한 사항",
 "산업재해에 관한 통계의 기록 및 유지에 관한 사항",
 "안전장치 및 보호구 구입 시 적격품 여부 확인에 관한 사항",
 "위험성평가의 실시 및 안전보건규칙에서 정하는 근로자의 위험 또는 건강장해의 방지에 관한 사항"
];
const APPT = {
  "안전보건관리책임자 (원청)": {
    job:"안전보건관리책임자", title:"안전보건관리책임자 선임서", fields:["현장명","성명"],
    law:'위 사람을 「산업안전보건법」 제15조에 의거 안전보건 업무를 총괄 관리할<br><b>안전보건관리책임자</b>로 선임합니다.',
    sections:[{title:"※ 안전보건관리책임자의 업무내용", items:DUTY_MGR}],
    signer:"대 표 이 사 &nbsp; 명 재 용"
  },
  "안전보건관리책임자 (협력사)": {
    job:"안전보건관리책임자", title:"안전보건관리책임자 선임서", fields:["현장명","업체명","공종명","성명"],
    law:'위 사람을 「산업안전보건법」 제15조에 의거 안전보건 업무를 총괄 관리할<br><b>안전보건관리책임자</b>로 선임합니다.',
    sections:[{title:"※ 안전보건관리책임자의 업무내용", items:DUTY_MGR}],
    signer:"현장대리인"
  },
  "안전관리자": {
    job:"안전관리자", title:"안전관리자 선임서", fields:["현장명","성명"],
    law:'위 사람을 「산업안전보건법」 제17조에 의거 안전·보건 업무를 담당하는<br><b>안전관리자</b>로 선임합니다.',
    sections:[{title:"※ 안전관리자의 업무내용", items:[
      "산업안전보건위원회 또는 안전 및 보건에 관한 노사협의체에서 심의·의결한 업무와 해당 사업장의 안전보건관리규정 및 취업규칙에서 정한 업무",
      "위험성평가에 관한 보좌 및 지도·조언",
      "안전인증대상기계등과 자율안전확인대상기계등 구입 시 적격품의 선정에 관한 보좌 및 지도·조언",
      "해당 사업장 안전교육계획의 수립 및 안전교육 실시에 관한 보좌 및 지도·조언",
      "사업장 순회점검, 지도 및 조치 건의",
      "산업재해 발생의 원인 조사·분석 및 재발 방지를 위한 기술적 보좌 및 지도·조언",
      "산업재해에 관한 통계의 유지·관리·분석을 위한 보좌 및 지도·조언",
      "법 또는 법에 따른 명령으로 정한 안전에 관한 사항의 이행에 관한 보좌 및 지도·조언",
      "업무 수행 내용의 기록·유지",
      "그 밖에 안전에 관한 사항으로서 고용노동부장관이 정하는 사항"
    ]}],
    signer:"대 표 이 사 &nbsp; 명 재 용"
  },
  "안전보건총괄책임자": {
    job:"안전보건총괄책임자", title:"안전보건총괄책임자 선임서", fields:["현장명","성명"],
    law:'위 사람을 「산업안전보건법」 제62조에 의거 안전보건 업무를 총괄 관리할<br><b>안전보건총괄책임자</b>로 선임합니다.',
    sections:[{title:"※ 안전보건총괄책임자의 업무내용", items:[
      "법 제36조에 따른 위험성평가의 실시에 관한 사항",
      "법 제51조 및 제54조에 따른 작업의 중지",
      "법 제64조에 따른 도급 시 산업재해 예방조치",
      "법 제72조제1항에 따른 산업안전보건관리비의 관계수급인 간의 사용에 관한 협의·조정 및 그 집행의 감독",
      "안전인증대상기계등과 자율안전확인대상기계등의 사용 여부 확인"
    ]}],
    signer:"대 표 이 사 &nbsp; 명 재 용"
  },
  "관리감독자": {
    job:"관리감독자", title:"관리감독자 지정서", fields:["현장명","성명","담당공종"],
    law:'위 사람을 「산업안전보건법」 제16조에 의거 현장 내 근로자들을 직접 지휘·감독하여<br>안전관리에 대한 업무를 수행할 <b>관리감독자</b>로 지정합니다.',
    sections:[{title:"※ 관리감독자의 업무내용", items:[
      "지휘·감독하는 작업과 관련된 기계·기구 또는 설비의 안전·보건점검 및 이상 유무의 확인",
      "소속된 근로자의 작업복·보호구 및 방호장치의 점검과 그 착용·사용에 관한 교육·지도",
      "해당 작업에서 발생한 산업재해에 관한 보고 및 이에 대한 응급조치",
      "해당 작업의 작업장 정리·정돈 및 통로 확보에 대한 확인·감독",
      "안전·보건관리자의 지도·조언에 대한 협조",
      "위험성평가에 관한 사항 중 유해·위험요인의 파악 및 개선조치의 시행에 대한 참여",
      "그 밖에 해당 작업의 안전 및 보건에 관한 사항으로서 고용노동부령으로 정하는 사항"
    ]}],
    signer:"대 표 이 사 &nbsp; 명 재 용"
  },
  "화재감시자": {
    job:"화재감시자", title:"화재감시자 지정서", fields:["현장명","협력사명","성명"],
    law:'위 사람을 「산업안전보건기준에 관한 규칙」 제241조의2에 의거 현장 내<br>화재사고 예방을 위한 <b>화재감시자</b>로 지정합니다.',
    sections:[
      {title:"※ 화재감시자의 배치", items:[
        "작업반경 11미터 이내 건물구조 자체나 내부에 가연성 물질이 있는 장소",
        "작업반경 11미터 이내 바닥 하부에 가연성 물질이 있는 등 불꽃에 의해 쉽게 발화될 장소",
        "가연성 물질이 금속으로 된 칸막이·벽·천장 또는 지붕의 반대쪽 면에 인접해 있어 열전도나 열복사에 의해 발화될 우려가 있는 장소"
      ]},
      {title:"※ 화재감시자의 업무", items:[
        "해당하는 장소에 가연성 물질이 있는지 여부의 확인",
        "폭발 또는 화재 위험의 장소에서 가스 검지 및 경보 성능을 갖춘 가스 검지·경보 장치의 작동 여부의 확인",
        "화재 발생 시 사업장 내 근로자의 대피 유도",
        "업무 수행에 필요한 확성기, 휴대용 조명기구 및 화재 대피용 마스크 등 대피용 방연장비 지급"
      ]}
    ],
    signer:"대 표 이 사 &nbsp; 명 재 용"
  }
};

const vals={};  // 공통 입력값(현장명·성명 등) 유지
function buildTypes(){ const sel=document.getElementById('type'); sel.innerHTML='';
  Object.keys(APPT).forEach(k=> sel.appendChild(new Option(k,k))); }

function render(){
  const a=APPT[document.getElementById('type').value];
  document.getElementById('title').textContent=a.title;
  let m='<div class="mrow"><span class="mlabel">직명</span><span class="mcolon">:</span><span class="mval mfixed">'+a.job+'</span></div>';
  a.fields.forEach(f=>{
    m+='<div class="mrow"><span class="mlabel">'+f+'</span><span class="mcolon">:</span><input type="text" class="mval" data-f="'+f+'"></div>';
  });
  document.getElementById('meta').innerHTML=m;
  document.querySelectorAll('#meta input[data-f]').forEach(inp=>{
    const f=inp.dataset.f; if(vals[f]!=null) inp.value=vals[f];
    inp.addEventListener('input',()=>{ vals[f]=inp.value; });
  });
  document.getElementById('law').innerHTML=a.law;
  let du='';
  a.sections.forEach(sec=>{ du+='<div class="dt">'+sec.title+'</div><ol>'+sec.items.map(it=>'<li>'+it+'</li>').join('')+'</ol>'; });
  document.getElementById('duties').innerHTML=du;
  document.getElementById('sign').innerHTML='<span class="co">'+CO+'</span> &nbsp; '+a.signer+' &nbsp; (인)';
}

function fmtDate(){
  const v=document.getElementById('day').value; let t='';
  if(v){ const p=v.split('-'); t=p[0]+'년  '+parseInt(p[1],10)+'월  '+parseInt(p[2],10)+'일'; }
  document.getElementById('dtext').textContent=t;
}
function setToday(){ document.getElementById('day').value=new Date().toISOString().slice(0,10); fmtDate(); }

function setPrintTitle(){
  const a=APPT[document.getElementById('type').value];
  const site=vals['현 장 명']||''; const d=(document.getElementById('day')||{}).value||new Date().toISOString().slice(0,10);
  document.title=(a.job+'_'+(a.title.indexOf('지정')>=0?'지정서':'선임서')+'_'+site+'_'+d).replace(/[\\/:*?"<>|]/g,'_');
}
window.addEventListener('beforeprint', setPrintTitle);
function printDoc(){ setPrintTitle(); window.print(); }

function clearAll(){ if(!confirm('입력한 내용을 모두 지울까요?'))return; try{localStorage.removeItem('apptDraft');}catch(e){}
  for(const k in vals) delete vals[k]; document.getElementById('type').selectedIndex=0; render(); setToday(); }
function saveDraft(){
  const data={ type:document.getElementById('type').value, day:document.getElementById('day').value, vals:vals };
  try{ localStorage.setItem('apptDraft',JSON.stringify(data)); alert('임시저장 완료.'); }catch(e){ alert('저장 실패: '+e.message); }
}
function loadDraft(){
  let d; try{ d=JSON.parse(localStorage.getItem('apptDraft')); }catch(e){ return false; }
  if(!d) return false;
  buildTypes(); if(d.type && APPT[d.type]) document.getElementById('type').value=d.type;
  if(d.vals) Object.assign(vals, d.vals);
  render();
  if(d.day){ document.getElementById('day').value=d.day; fmtDate(); } else setToday();
  return true;
}
buildTypes();
if(!loadDraft()){ render(); setToday(); }
</script>
</body>
</html>
