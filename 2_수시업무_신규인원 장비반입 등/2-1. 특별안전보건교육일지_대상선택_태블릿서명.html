<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>특별안전보건교육일지 (대상 선택형)</title>
<style>
  :root{ --line:#333; --hd:#1f4e79; --hdbg:#dbe5f1; --accent:#1f6feb; --ok:#127c2b; --no:#b02a2a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; font-family:"맑은 고딕","Malgun Gothic",AppleGothic,sans-serif; color:#111; background:#f2f4f7; }
  .wrap{ max-width:1000px; margin:0 auto; padding:12px; }
  .paper{ background:#fff; padding:18px 20px 26px; box-shadow:0 1px 6px rgba(0,0,0,.15); }
  h1{ text-align:center; font-size:22px; margin:2px 0 12px; letter-spacing:2px; }
  .sub{ text-align:center; font-size:12px; color:#555; margin:-8px 0 12px; }
  .block{ border:1.5px solid var(--line); margin-bottom:10px; }
  .brow{ display:flex; border-bottom:1px solid var(--line); font-size:14px; }
  .brow:last-child{ border-bottom:none; }
  .bl{ background:var(--hdbg); color:var(--hd); font-weight:700; padding:8px 10px; min-width:120px; display:flex; align-items:center; }
  .bc{ padding:6px 10px; flex:1; display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; }
  .bc input[type=text]{ border:none; border-bottom:1px solid #999; font-size:14px; padding:3px 4px; font-family:inherit; }
  .bc select{ font-size:14px; padding:4px 6px; font-family:inherit; border:1px solid #999; border-radius:5px; }
  .timesel{ font-size:14px; padding:4px 6px; font-family:inherit; border:1px solid #999; border-radius:5px; }
  #target{ font-size:15px; font-weight:700; color:var(--hd); min-width:260px; border:1.5px solid var(--accent); }
  .sitesel{ font-size:14px; font-weight:700; padding:5px 8px; font-family:inherit; border:1.5px solid var(--accent); border-radius:5px; color:var(--hd); max-width:100%; }
  .fixed{ font-weight:700; }
  .chk{ display:inline-flex; align-items:center; gap:5px; cursor:pointer; user-select:none; font-size:13px; }
  .chk .b{ width:19px; height:19px; border:1.6px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; line-height:1; flex:0 0 auto; }
  .chk.on .b{ background:var(--accent); color:#fff; border-color:var(--accent); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ border:1px solid var(--line); padding:3px 5px; text-align:center; }
  thead th{ background:var(--hdbg); color:var(--hd); font-size:12px; padding:6px 4px; }
  td.rowlabel{ background:var(--hdbg); color:var(--hd); font-weight:700; text-align:center; vertical-align:middle; }
  td.cell-in input{ width:100%; border:none; text-align:center; font-size:14px; padding:6px 2px; font-family:inherit; background:transparent; }
  td.cell-in input:focus{ outline:2px solid var(--accent); outline-offset:-2px; }
  .cofill{ display:flex; align-items:stretch; }
  .cofill input{ flex:1; }
  .cofill .fillbtn{ flex:0 0 auto; width:30px; border:none; border-left:1px solid #ccc; background:#eef3fb; color:var(--accent); font-size:14px; font-weight:800; cursor:pointer; }
  .cofill .fillbtn:active{ background:var(--accent); color:#fff; }
  .cnt input{ width:52px; border:none; border-bottom:1px solid #999; text-align:center; font-size:14px; font-family:inherit; padding:3px 2px; }
  .subjects{ padding:8px 12px; font-size:13px; line-height:1.7; }
  .subjects .chk{ display:flex; margin:3px 0; align-items:flex-start; }
  .colno{ width:42px; } .colco{ width:36%; } .colnm{ width:22%; } .colsig{ width:auto; }
  .sigcell{ position:relative; height:48px; padding:0; cursor:pointer; }
  .sigcell canvas{ display:block; width:100%; height:48px; }
  .sigcell .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:12px; pointer-events:none; }
  textarea#note{ width:100%; min-height:56px; border:none; font-size:14px; font-family:inherit; padding:8px 10px; resize:vertical; }
  .controls{ position:sticky; bottom:0; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px; background:rgba(242,244,247,.95); margin-top:14px; }
  .btn{ border:none; border-radius:8px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.p{ background:var(--accent); color:#fff; } .btn.g{ background:#5b6470; color:#fff; }
  .btn.d{ background:#fff; color:#333; border:1.5px solid #bbb; }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal.show{ display:flex; }
  .sheet{ background:#fff; border-radius:14px; width:min(94vw,720px); padding:16px; }
  .sheet h3{ margin:0 0 4px; font-size:17px; text-align:center; }
  .sheet p{ margin:0 0 10px; text-align:center; color:#666; font-size:13px; }
  .padwrap{ border:2px dashed #9aa4b0; border-radius:10px; background:#fff; }
  #padBig{ display:block; width:100%; height:300px; touch-action:none; border-radius:10px; }
  .sheet .row{ display:flex; gap:10px; margin-top:12px; }
  .sheet .row .btn{ flex:1; }
  @media print{
    body{ background:#fff; } .wrap{ padding:0; max-width:none; } .paper{ box-shadow:none; padding:0; }
    .controls,.modal{ display:none !important; } .cofill .fillbtn{ display:none !important; }
    thead th,.bl,td.rowlabel,.chk.on .b{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #target{ border:none; }
    @page{ size:A4 portrait; margin:9mm; }
  }
</style>
</head>
<body>
<div class="wrap">
 <div class="paper">
  <h1>특별 안전 · 보건 교육일지</h1>
  <div class="sub">특별안전보건교육 (2시간 이상) · 대상 선택 시 교육내용 자동 변경</div>

  <div class="block">
    <div class="brow">
      <div class="bl">공사명</div>
      <div class="bc"><select id="site" class="sitesel"></select></div>
    </div>
    <div class="brow">
      <div class="bl">특별교육 대상</div>
      <div class="bc"><select id="target"></select></div>
    </div>
    <div class="brow">
      <div class="bl">작성일자</div>
      <div class="bc">
        <input type="date" id="day">
        &nbsp;교육시간
        <select id="timeStart" class="timesel"></select>
        <span style="font-weight:700">~</span>
        <select id="timeEnd" class="timesel"></select>
      </div>
    </div>
    <div class="brow">
      <div class="bl">교육의 구분</div>
      <div class="bc"><span class="fixed">특별안전보건교육 (16시간 이상 / 단기간·간헐적 작업 2시간 이상)</span></div>
    </div>
  </div>

  <!-- 교육인원 -->
  <table class="cnt">
    <thead>
      <tr><th style="width:150px">교육인원</th><th>계</th><th>남</th><th>여</th><th style="width:34%">교육 미실시 사유</th></tr>
    </thead>
    <tbody>
      <tr><td class="rowlabel">교육 대상자수</td>
        <td><input type="text" data-c="tot_gye"></td><td><input type="text" data-c="tot_m"></td><td><input type="text" data-c="tot_f"></td>
        <td rowspan="3"><textarea data-c="reason" style="width:100%;border:none;font-family:inherit;font-size:13px;min-height:66px;resize:vertical"></textarea></td></tr>
      <tr><td class="rowlabel">교육 실시자수</td>
        <td><input type="text" data-c="do_gye"></td><td><input type="text" data-c="do_m"></td><td><input type="text" data-c="do_f"></td></tr>
      <tr><td class="rowlabel">교육 미실시자수</td>
        <td><input type="text" data-c="no_gye"></td><td><input type="text" data-c="no_m"></td><td><input type="text" data-c="no_f"></td></tr>
    </tbody>
  </table>

  <!-- 교육과목 (동적) -->
  <div class="block">
    <div class="brow"><div class="bl" style="min-width:100%">교육과목 <span id="subjTitle" style="font-weight:400;margin-left:6px"></span></div></div>
    <div class="subjects" id="subjects"></div>
  </div>

  <!-- 교육실시자 및 장소 -->
  <table>
    <thead><tr><th style="width:150px">교육실시자 및 장소</th><th>성명</th><th>직위</th><th>교육실시장소</th><th style="width:16%">비고</th></tr></thead>
    <tbody><tr>
      <td class="rowlabel" style="width:150px">담당</td>
      <td class="cell-in"><input type="text" data-c="tname"></td>
      <td class="cell-in"><input type="text" data-c="tpos"></td>
      <td class="cell-in"><input type="text" data-c="tplace" placeholder="현장 교육장"></td>
      <td class="cell-in"><input type="text" data-c="tetc"></td>
    </tr></tbody>
  </table>

  <!-- 교육대상자 서명란 -->
  <table id="tbl">
    <thead>
      <tr>
        <th class="colno">No</th>
        <th class="colco">소속(회사명)</th>
        <th class="colnm">성명</th>
        <th class="colsig">서명 <span style="font-weight:400">(터치)</span></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <!-- 특이사항 -->
  <div class="block" style="margin-top:10px">
    <div class="brow"><div class="bl" style="min-width:100%">특이사항</div></div>
    <textarea id="note" placeholder="특이사항 입력"></textarea>
  </div>

 </div>
</div>

<div class="controls">
  <button class="btn p" onclick="printDoc()">📄 PDF로 저장 / 인쇄</button>
  <button class="btn d" onclick="addRow()">＋ 서명행 추가</button>
  <button class="btn d" onclick="saveDraft()">💾 임시저장</button>
  <button class="btn g" onclick="clearAll()">전체 초기화</button>
</div>

<!-- Signature modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle">서명</h3>
    <p>아래 칸에 손가락 또는 스타일러스로 서명하세요</p>
    <div class="padwrap"><canvas id="padBig"></canvas></div>
    <div class="row">
      <button class="btn d" onclick="undoBig()">↩ 지우기</button>
      <button class="btn g" onclick="closeModal()">취소</button>
      <button class="btn p" onclick="confirmSig()">✔ 서명 완료</button>
    </div>
  </div>
</div>

<script src="../sites.js"></script>

  const sel=document.getElementById('site'); sel.innerHTML='';

    "화재위험작업으로 인한 불꽃, 불티 등의 흩날림 방지 조치에 관한 사항",
    "인화성 액체의 증기가 남아 있지 않도록 환기 등의 조치에 관한 사항",
    "화재감시자의 직무 및 피난교육 등 비상조치에 관한 사항", ETC],
  "굴착면 높이 2m 이상 굴착작업": [COMMON,
    "지반의 형태·구조 및 굴착 요령에 관한 사항",
    "지반의 붕괴재해 예방에 관한 사항",
    "붕괴 방지용 구조물 설치 및 작업방법에 관한 사항",
    "보호구의 종류 및 사용에 관한 사항", ETC]
};

/* ---------- 대상 dropdown ---------- */
function buildTarget(){
  const sel=document.getElementById('target'); sel.innerHTML='';
  Object.keys(SPECIAL).forEach(k=> sel.appendChild(new Option(k,k)));
  sel.addEventListener('change', renderSubjects);
}
/* ---------- 교육과목 (선택 대상에 따라) ---------- */
function renderSubjects(){
  const key=document.getElementById('target').value;
  document.getElementById('subjTitle').textContent = '· '+key;
  const box=document.getElementById('subjects'); box.innerHTML='';
  (SPECIAL[key]||[]).forEach((s)=>{
    const d=document.createElement('div');
    d.className='chk on';
    d.innerHTML=`<span class="b">✓</span><span>○ ${s}</span>`;
    d.addEventListener('click',()=>{ d.classList.toggle('on'); d.querySelector('.b').textContent=d.classList.contains('on')?'✓':''; });
    box.appendChild(d);
  });
}

/* ---------- 교육시간 (1시간 단위) ---------- */
function buildTimes(){
  const s=document.getElementById('timeStart'), e=document.getElementById('timeEnd');
  s.innerHTML=''; e.innerHTML='';
  for(let h=6; h<=20; h++){ const t=String(h).padStart(2,'0')+':00'; s.appendChild(new Option(t,t)); e.appendChild(new Option(t,t)); }
  s.value='09:00'; e.value='11:00';
}

/* ---------- 서명 rows ---------- */
function makeRow(n){
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td class="colno">${n}</td>
    <td class="cell-in colco"><div class="cofill"><input type="text" data-k="co"><button type="button" class="fillbtn" title="바로 아랫줄에 소속 동일 적용">▼</button></div></td>
    <td class="cell-in colnm"><input type="text" data-k="nm"></td>
    <td class="sigcell colsig"><canvas></canvas><div class="ph">여기를 눌러 서명</div></td>`;
  tr.querySelector('.sigcell').addEventListener('click',function(){ openModal(this); });
  tr.querySelector('.fillbtn').addEventListener('click',function(){ fillDown(tr); });
  return tr;
}
function fillDown(fromTr){
  const val=fromTr.querySelector('[data-k=co]').value;
  if(!val){ alert('먼저 이 행의 소속을 입력하세요.'); return; }
  const next=fromTr.nextElementSibling;
  if(!next){ alert('아래에 채울 행이 없습니다.'); return; }
  next.querySelector('[data-k=co]').value=val;
}
function addRow(){ const b=document.getElementById('rows'); b.appendChild(makeRow(b.children.length+1)); }
function buildRows(k){ const b=document.getElementById('rows'); b.innerHTML=''; for(let i=1;i<=k;i++) b.appendChild(makeRow(i)); }

/* ---------- signature modal / drawing ---------- */
const modal=document.getElementById('modal');
const padBig=document.getElementById('padBig');
const bctx=padBig.getContext('2d');
let drawing=false, hasInk=false, last=null;

function sizeBig(){
  const r=padBig.getBoundingClientRect();
  padBig.width=r.width*DPR; padBig.height=r.height*DPR;
  bctx.setTransform(1,0,0,1,0,0);
  bctx.scale(DPR,DPR);
  bctx.lineWidth=2.6; bctx.lineCap='round'; bctx.lineJoin='round'; bctx.strokeStyle='#000000';
  hasInk=false;
}
function posBig(e){ const r=padBig.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function startB(e){ e.preventDefault(); drawing=true; last=posBig(e);
  try{ padBig.setPointerCapture(e.pointerId); }catch(_){}
  bctx.beginPath(); bctx.moveTo(last.x,last.y); bctx.lineTo(last.x+0.1,last.y+0.1); bctx.stroke(); hasInk=true; }
function moveB(e){ if(!drawing)return; e.preventDefault(); const p=posBig(e);
  bctx.beginPath(); bctx.moveTo(last.x,last.y); bctx.lineTo(p.x,p.y); bctx.stroke(); last=p; hasInk=true; }
function endB(e){ if(drawing){ drawing=false; try{ padBig.releasePointerCapture(e.pointerId); }catch(_){} } }
padBig.addEventListener('pointerdown',startB);
padBig.addEventListener('pointermove',moveB);
padBig.addEventListener('pointerup',endB);
padBig.addEventListener('pointercancel',endB);

function openModal(sigcell){
  curIndex=sigcell;
  const tr=sigcell.closest('tr');
  const nm=tr.querySelector('[data-k=nm]').value || tr.children[0].textContent;
  document.getElementById('mTitle').textContent = nm ? nm+' 님 서명' : '서명';
  modal.classList.add('show');
  requestAnimationFrame(()=>{ sizeBig(); });
}
function closeModal(){ modal.classList.remove('show'); }
function undoBig(){ bctx.save(); bctx.setTransform(1,0,0,1,0,0); bctx.clearRect(0,0,padBig.width,padBig.height); bctx.restore(); hasInk=false; }
function confirmSig(){
  if(!hasInk){ closeModal(); return; }
  const cell=curIndex, cnv=cell.querySelector('canvas'), r=cell.getBoundingClientRect();
  cnv.width=r.width*DPR; cnv.height=48*DPR;
  cnv.getContext('2d').drawImage(padBig, 0,0, padBig.width,padBig.height, 0,0, cnv.width, cnv.height);
  cell.querySelector('.ph').style.display='none';
  closeModal();
}

/* ---------- actions ---------- */
function printDoc(){ window.print(); }
function setToday(){ document.getElementById('day').value=new Date().toISOString().slice(0,10); }
function allInputs(){ return [...document.querySelectorAll('[data-c]')]; }

function clearAll(){
  if(!confirm('입력한 내용과 서명을 모두 지울까요?')) return;
  try{ localStorage.removeItem('specDraft'); }catch(e){}
  buildRows(ROWS_DEFAULT); buildTimes(); setToday();
  document.getElementById('target').selectedIndex=0; renderSubjects();
  document.getElementById('note').value='';
  allInputs().forEach(el=>el.value='');
}
function saveDraft(){
  const data={
    site:document.getElementById('site').value,
    target:document.getElementById('target').value,
    day:day.value, timeStart:document.getElementById('timeStart').value, timeEnd:document.getElementById('timeEnd').value,
    note:document.getElementById('note').value,
    subjOff:[...document.querySelectorAll('#subjects .chk')].map(c=>c.classList.contains('on')?1:0),
    fields:Object.fromEntries(allInputs().map(el=>[el.dataset.c, el.value])),
    rows:[...document.querySelectorAll('#rows tr')].map(tr=>({
      co:tr.querySelector('[data-k=co]').value, nm:tr.querySelector('[data-k=nm]').value,
      sig:(tr.querySelector('.sigcell .ph').style.display==='none')?tr.querySelector('.sigcell canvas').toDataURL('image/png'):''
    }))};
  try{ localStorage.setItem('specDraft',JSON.stringify(data)); alert('임시저장 완료. 이 파일을 다시 열면 복원됩니다.'); }
  catch(e){ alert('저장 실패: '+e.message); }
}
function loadDraft(){
  let d; try{ d=JSON.parse(localStorage.getItem('specDraft')); }catch(e){ return false; }
  if(!d || !Array.isArray(d.rows)) return false;
  buildSites(); buildTarget(); buildTimes();
  if(d.site) document.getElementById('site').value=d.site;
  if(d.target && SPECIAL[d.target]) document.getElementById('target').value=d.target;
  renderSubjects();
  (d.subjOff||[]).forEach((v,i)=>{ const c=document.querySelectorAll('#subjects .chk')[i]; if(c){ c.classList.toggle('on',!!v); c.querySelector('.b').textContent=v?'✓':''; }});
  day.value=d.day||''; document.getElementById('note').value=d.note||'';
  if(d.timeStart) document.getElementById('timeStart').value=d.timeStart;
  if(d.timeEnd) document.getElementById('timeEnd').value=d.timeEnd;
  if(d.fields) allInputs().forEach(el=>{ if(d.fields[el.dataset.c]!=null) el.value=d.fields[el.dataset.c]; });
  buildRows(Math.max(d.rows.length,ROWS_DEFAULT));
  const trs=document.querySelectorAll('#rows tr');
  d.rows.forEach((rd,i)=>{
    const tr=trs[i]; if(!tr) return;
    tr.querySelector('[data-k=co]').value=rd.co||'';
    tr.querySelector('[data-k=nm]').value=rd.nm||'';
    if(rd.sig){ const img=new Image(), cnv=tr.querySelector('.sigcell canvas'), r=tr.querySelector('.sigcell').getBoundingClientRect();
      img.onload=()=>{ cnv.width=r.width*DPR; cnv.height=48*DPR; cnv.getContext('2d').drawImage(img,0,0,cnv.width,cnv.height); };
      img.src=rd.sig; tr.querySelector('.sigcell .ph').style.display='none'; }
  });
  return true;
}

/* init */
if(!loadDraft()){ buildSites(); buildTarget(); buildTimes(); renderSubjects(); buildRows(ROWS_DEFAULT); setToday(); }
</script>
</body>
